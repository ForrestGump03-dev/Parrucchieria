<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caricamento...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff; /* Sfondo bianco o scuro a seconda del tema */
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        #splash-logo {
            max-width: 80%; /* Si adatta alla finestra */
            max-height: 80vh;
            object-fit: contain;
            animation: fadeIn 0.5s ease-out;
        }
        .loader {
            margin-top: 20px;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0f172a; /* Slate 900 */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: auto;
            margin-right: auto;
            display: none; /* Nascondiamo se il logo è già esplicativo, o lo mostriamo */
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Usa splash.png che è presente nella cartella -->
        <img src="splash.png" id="splash-logo" alt="Root Manager">
        <div class="loader"></div>
    </div>
</body>
</html>
